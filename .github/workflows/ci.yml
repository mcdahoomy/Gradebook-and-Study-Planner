name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out your code
      - name: Checkout
        uses: actions/checkout@v4

      # Set up JDK 21 (Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Make Gradle wrapper executable (Linux runner)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build + run tests (-S shows full stacktraces on failure)
      - name: Build with Gradle
        run: ./gradlew build -S
